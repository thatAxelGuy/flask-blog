<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Update Post</h1>

    <a class="back-button" href="{{ url_for('index') }}">← Back to Home</a>

    <div class="post form-container">

        <form action="{{ url_for('update', post_id=post.id) }}" method="POST">

            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" value="{{post.author}}" required>
            </div>

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{post.title}}" required>
            </div>

            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" rows="10" required>{{post.content}}</textarea>
            </div>

            <button class="form-button" type="submit">Update Post</button>

        </form>

    </div>

</body>
</html>
